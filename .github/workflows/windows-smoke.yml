name: Windows smoke test

# The offline voice is the one feature that cannot be proven from Linux: the
# Windows espeak-ng.exe has to load on a real machine, with the MSVC runtime
# sitting next to it, and Piper has to run the model there too. Wine is a good
# approximation, not the same thing.
#
# Public repository, so the standard GitHub-hosted runner is free.
#
# Every step uses bash on purpose: the PowerShell shipped with the runner image
# failed to start a console host on the first attempt. MSYS rewrites arguments
# that look like unix paths, so the switches of cmd and the installer are
# spelled the MSYS way (`//c`) or excluded from the conversion.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (blank = latest release)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Installer + offline TTS on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the published installer
        run: |
          if [ -n '${{ inputs.tag }}' ]; then
            gh release download '${{ inputs.tag }}' --pattern '*Setup*.exe' --dir dist --clobber
          else
            gh release download --pattern '*Setup*.exe' --dir dist --clobber
          fi
          ls -la dist/

      - name: Install silently
        env:
          # Let /S and /D= reach the installer as written; everything else is
          # still converted, which is what makes //c become /c for cmd.
          MSYS2_ARG_CONV_EXCL: '/S;/D=*'
        run: |
          installer="dist\\$(ls dist | grep 'Setup' | head -1)"
          echo "menjalankan: $installer /S"
          if ! timeout 420 cmd //c start //wait "" "$installer" /S; then
            echo "::error::installer gagal atau menggantung"
            exit 1
          fi
          # Default destination, i.e. what a real user gets. Asking NSIS for a
          # custom /D= path with forward slashes made it silently ignore the
          # request and install here anyway.
          programs="$(cygpath -u "$LOCALAPPDATA")/Programs"
          root="$programs/SelfMusic Studio"
          if [ ! -f "$root/SelfMusic Studio.exe" ]; then
            echo "::error::aplikasi tidak ditemukan di $root"
            ls -la "$programs" 2>/dev/null || true
            exit 1
          fi
          {
            echo "INSTALL_MOUNT=$root"
            echo "ENGINE_MOUNT=$root/resources/tts/espeak/win32"
          } >> "$GITHUB_ENV"
          ls "$root"

      - name: eSpeak runs, with the bundled MSVC runtime
        run: |
          exe="$ENGINE_MOUNT/espeak-ng.exe"
          [ -f "$exe" ] || { echo "::error::espeak-ng.exe tidak ada di paket"; exit 1; }
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            [ -f "$ENGINE_MOUNT/$dll" ] || { echo "::error::runtime MSVC $dll tidak ikut terpasang"; exit 1; }
          done
          # Only the Windows engine may ship: the others are dead weight.
          engines=$(ls "$INSTALL_MOUNT/resources/tts/espeak")
          [ "$engines" = "win32" ] || { echo "::error::paket membawa engine asing: $engines"; exit 1; }

          voices=$("$exe" --path "$ENGINE_MOUNT/espeak-ng-data" --voices=id)
          echo "$voices" | grep -q Indonesian || { echo "::error::daftar suara tidak memuat Indonesian"; echo "$voices"; exit 1; }
          # eSpeak listing its built-in mbrola voices is expected; dropping them
          # is the app's job, and `npm test` below is what checks that.

          # Exactly how electron/tts.cjs calls it: text on stdin, no -f.
          ipa=$(printf 'Halo dunia, selamat pagi!\n' | "$exe" --path "$ENGINE_MOUNT/espeak-ng-data" -v id -q --ipa=2)
          [ -n "$ipa" ] || { echo "::error::tidak ada fonem yang dihasilkan"; exit 1; }
          echo "$ipa"
          # U+02C8 / U+02D0 are stress marks; without them the phonemizer is off.
          # Node rather than grep: PCRE spells it \x{02c8}, not \u02c8.
          node -e 'if (!/[\u02c8\u02d0]/.test(process.argv[1])) { console.error("fonem tanpa tanda stress: " + process.argv[1]); process.exit(1) }' "$ipa"
          echo "fonem Indonesia: $ipa"

      - name: End-to-end synthesis with the shipped assets
        run: |
          ls -la "$ENGINE_MOUNT"
          npm ci --omit=dev
          # Point the tests at the installation itself, so what is verified is
          # the exact files the installer put on disk -- no copying involved.
          res_win="$(cygpath -w "$INSTALL_MOUNT/resources")"
          echo "SMS_RESOURCES_PATH=$res_win"
          SMS_RESOURCES_PATH="$res_win" npm test

      - name: Package contains the licence texts
        run: |
          [ -f "$INSTALL_MOUNT/resources/app.asar" ] || { echo "::error::app.asar tidak ada"; exit 1; }
          # Anything piped through npx arrives with CRLF, which defeats exact
          # line matching.
          npx --yes @electron/asar list "$INSTALL_MOUNT/resources/app.asar" | tr -d '\r' > asar-list.txt
          for entry in /COPYING /LICENSE /COPYRIGHT-NOTICE.txt /THIRD-PARTY-NOTICES.md \
                       /electron/tts.cjs /resources/license.txt; do
            grep -qx "$entry" asar-list.txt || { echo "::error::app.asar tidak memuat $entry"; exit 1; }
          done
          echo "semua teks lisensi ada di app.asar"

      - name: Update metadata points at assets that really exist
        run: |
          # A mismatch here means auto-update 404s for every user.
          gh release download --pattern 'latest*.yml' --dir dist --clobber
          gh release view --json assets --jq '.assets[].name' | tr -d '\r' > assets.txt
          for file in dist/latest.yml dist/latest-linux.yml; do
            name=$(tr -d '\r' < "$file" | sed -n 's/^path: //p' | head -1)
            [ -n "$name" ] || { echo "::error::$file tidak menyebut path berkas"; exit 1; }
            grep -qxF "$name" assets.txt || {
              echo "::error::$file menunjuk '$name' tapi aset itu tidak ada di rilis"
              cat assets.txt
              exit 1
            }
            echo "  $(basename "$file") -> $name  OK"
          done

      - name: Installed app starts
        continue-on-error: true
        run: |
          # A runner has no interactive desktop, so this is a smoke signal, not
          # a guarantee: a GUI-only crash would slip through here.
          "$INSTALL_MOUNT/SelfMusic Studio.exe" &
          sleep 20
          if ! tasklist //FI "IM eq SelfMusic Studio.exe" //NH | grep -qi "SelfMusic"; then
            echo "::warning::aplikasi sudah tidak berjalan setelah 20 detik"
            exit 1
          fi
          taskkill //IM "SelfMusic Studio.exe" //F || true
          echo "aplikasi masih hidup setelah 20 detik"